<!doctype html>
<html lang="zh-CN" data-rc-skin="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111113" />
    <meta
      name="description"
      content="ReproCheck 科研复现审计官 —— 结构化抽取与参数一致性审计工作台"
    />
    <script>
      ;(function () {
        var saved
        try {
          saved = window.localStorage.getItem('rc:theme:v1')
        } catch (e) {}
        var systemDark = !window.matchMedia || window.matchMedia('(prefers-color-scheme: dark)').matches
        var skin = saved === 'light' || saved === 'dark' ? saved : systemDark ? 'dark' : 'light'
        document.documentElement.setAttribute('data-rc-skin', skin)
        var meta = document.querySelector('meta[name="theme-color"]')
        if (meta) meta.setAttribute('content', skin === 'light' ? '#f4f1ea' : '#111113')
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>ReproCheck · 科研复现审计官</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
